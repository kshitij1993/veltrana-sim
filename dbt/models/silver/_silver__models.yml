version: 2

models:
  - name: int_hcp_master_normalized
    description: bronze.hcp_master with matching-key normalization added. One row per raw quarterly snapshot row.

  - name: int_hcp_master_latest
    description: One row per raw identity (collapse_key), collapsed to its latest known quarterly state.
    columns:
      - name: collapse_key
        tests:
          - unique
          - not_null

  - name: int_hcp_fuzzy_candidates
    description: Mutual best-match candidate pairs across raw identities, blocked on territory + specialty.

  - name: int_hcp_golden_assignment
    description: Every raw identity mapped to the canonical key of its golden group.
    columns:
      - name: collapse_key
        tests:
          - unique
          - not_null
      - name: canonical_key
        tests:
          - not_null

  - name: int_hcp_golden_ids
    description: One stable surrogate golden_hcp_id per canonical key.
    columns:
      - name: canonical_key
        tests:
          - unique
          - not_null
      - name: golden_hcp_id
        tests:
          - unique
          - not_null

  - name: hcp_golden_record
    description: >
      One row per real HCP after deduping bronze.hcp_master's quarterly
      snapshots and merging the ~8% duplicate MDM records that didn't
      share a usable npi with their real counterpart.
    columns:
      - name: golden_hcp_id
        description: Silver's own surrogate key for a real HCP - not any single source system's id.
        tests:
          - unique
          - not_null
      - name: n_source_records
        description: How many raw hcp_master identities (distinct hcp_id) fed into this golden record.
        tests:
          - not_null

  - name: hcp_golden_record_xref
    description: >
      Audit trail from every raw hcp_master identity to the golden_hcp_id
      it collapsed into, with the match evidence behind any fuzzy match.
    columns:
      - name: raw_identity_key
        tests:
          - unique
          - not_null
      - name: golden_hcp_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hcp_golden_record')
                field: golden_hcp_id

  - name: rx_audit_clean
    description: >
      bronze.rx_audit with hcp_id replaced by golden_hcp_id via
      hcp_golden_record_xref. Every other value is untouched Bronze
      output - projection noise, restatement shift, and all.
    columns:
      - name: golden_hcp_id
        description: Null would mean some rx_audit hcp_id failed to resolve to a golden record - should never happen.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hcp_golden_record')
                field: golden_hcp_id

  - name: claims_clean
    description: >
      bronze.claims with hcp_id replaced by golden_hcp_id via
      hcp_golden_record_xref. Every other value, including the already-
      tokenized patient_token, is untouched Bronze output.
    columns:
      - name: claim_id
        tests:
          - unique
          - not_null
      - name: golden_hcp_id
        description: Null would mean some claims hcp_id failed to resolve to a golden record - should never happen.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hcp_golden_record')
                field: golden_hcp_id

  - name: sp_hub_normalized
    description: >
      bronze.sp_hub with each SP's own status_code vocabulary collapsed
      to one canonical journey_stage via the sp_status_code_map seed, so
      a funnel doesn't need per-SP branching logic.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: journey_stage
        description: Null would mean some (sp, status_code) pair wasn't in the seed - should never happen.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - referral_received
                  - benefit_verification
                  - pa_pending
                  - pa_approved
                  - pa_denied
                  - first_fill
                  - refill
                  - abandoned

seeds:
  - name: sp_status_code_map
    description: >
      sp x status_code -> canonical journey_stage, generated straight
      from generator/config.py's SP_STATUS_CODE_MAPS (see the script
      note at the top of the CSV's generation - it's not hand-maintained
      separately from the generator's own definition).
    columns:
      - name: sp
        tests:
          - not_null
      - name: status_code
        tests:
          - not_null
      - name: journey_stage
        tests:
          - not_null
