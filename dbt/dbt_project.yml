name: "veltrana_sim"
version: "1.0.0"
config-version: 2

# Matches the profile name in ~/.dbt/profiles.yml (generated by
# scripts/generate_profile.py - never committed here).
profile: "veltrana_sim"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Fuzzy matching in silver.hcp_golden_record needs pg_trgm's similarity().
on-run-start:
  - "create extension if not exists pg_trgm"

models:
  veltrana_sim:
    silver:
      +materialized: table
