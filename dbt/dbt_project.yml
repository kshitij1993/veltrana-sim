name: "veltrana_sim"
version: "1.0.0"
config-version: 2

# Matches the profile name in ~/.dbt/profiles.yml (generated by
# scripts/generate_profile.py - never committed here).
profile: "veltrana_sim"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# pg_trgm: fuzzy matching in silver.hcp_golden_record needs similarity().
# pgcrypto: gold.patient_journey_funnel needs digest() to recompute claims'
# patient token (see that model's comments for why that's legitimate).
on-run-start:
  - "create extension if not exists pg_trgm"
  - "create extension if not exists pgcrypto"

models:
  veltrana_sim:
    silver:
      +materialized: table
    gold:
      +materialized: table
      +schema: gold
