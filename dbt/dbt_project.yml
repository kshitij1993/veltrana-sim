name: "veltrana_sim"
version: "1.0.0"
config-version: 2

# Matches the profile name in ~/.dbt/profiles.yml (generated by
# scripts/generate_profile.py - never committed here).
profile: "veltrana_sim"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Must mirror generator/config.py's dosing-schedule constants exactly
# (VELTRANA_INDUCTION_INTERVAL_DAYS, PRODUCT_FILL_INTERVAL_DAYS["VELTRANA"]).
# Referenced, not hardcoded, so int_persistence_km's per-patient
# discontinuation detection stays traceable to the product's actual
# dosing cadence instead of being bare magic numbers.
vars:
  veltrana_induction_interval_days: 28
  veltrana_maintenance_interval_days: 84

# pg_trgm: fuzzy matching in silver.hcp_golden_record needs similarity().
# pgcrypto: gold.patient_journey_funnel needs digest() to recompute claims'
# patient token (see that model's comments for why that's legitimate).
on-run-start:
  - "create extension if not exists pg_trgm"
  - "create extension if not exists pgcrypto"

models:
  veltrana_sim:
    silver:
      +materialized: table
    gold:
      +materialized: table
      +schema: gold
